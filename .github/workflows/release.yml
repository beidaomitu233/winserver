name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-windows:
    name: publish-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify tag matches application version
        shell: pwsh
        run: |
          $config = Get-Content -Raw frontend/src-tauri/tauri.conf.json | ConvertFrom-Json
          $expected = "v$($config.version)"
          if ("${{ github.ref_name }}" -ne $expected) {
            throw "Tag ${{ github.ref_name }} does not match application version $expected"
          }

      - name: Restore bundled runtime resources
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "winserver-runtime-bundle-v1.zip"
          $url = "https://github.com/beidaomitu233/winserver/releases/download/v1.0.0/winserver-runtime-bundle-v1.zip"
          $expectedHash = "D267C58574B0BE74DE07FCA78F4E2CCA306ABA9CCAB2B60EEB5752B4371B892F"

          Invoke-WebRequest -Uri $url -OutFile $archive
          $actualHash = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Runtime bundle checksum mismatch: expected $expectedHash, got $actualHash"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath runtime -Force

      - name: Run release checks
        run: |
          cargo test --workspace --all-targets
          cargo clippy --workspace --all-targets -- -D warnings
          node tests/verify-runtime-resources.js

      - name: Build signed installer and publish updater manifest
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "WinServer ${{ github.ref_name }}"
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          updaterJsonPreferNsis: true
          uploadUpdaterJson: true
          uploadUpdaterSignatures: true
          args: --bundles nsis

      - name: Normalize and validate updater manifest URLs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & .github/scripts/normalize-updater-manifest.ps1 `
            -Repository "${{ github.repository }}" `
            -Tag "${{ github.ref_name }}" `
            -Publish
