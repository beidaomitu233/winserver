<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XP.CN 小皮 - 本地开发环境管理</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-main">XP<span>.</span></div>
          <div class="brand-side">
            <strong>小皮</strong>
            <span>CN</span>
          </div>
        </div>

        <nav class="side-nav" aria-label="主导航">
          <button class="nav-item is-active" type="button" data-view="home">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M3 11.6 12 4l9 7.6"/><path d="M5 10.5V21h5v-6h4v6h5V10.5"/></svg>
            </span>
            <span>首页</span>
          </button>
          <button class="nav-item" type="button" data-view="website">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3c2.5 2.5 3.7 5.5 3.7 9S14.5 18.5 12 21"/><path d="M12 3C9.5 5.5 8.3 8.5 8.3 12s1.2 6.5 3.7 9"/></svg>
            </span>
            <span>网站</span>
          </button>
          <button class="nav-item" type="button" data-view="database">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v12c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 11c0 1.7 3.1 3 7 3s7-1.3 7-3"/></svg>
            </span>
            <span>数据库</span>
          </button>
          <button class="nav-item" type="button" data-view="ftp">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="10" rx="1.5"/><path d="M8 20h8"/><path d="M12 14v6"/><path d="M4 20h16"/></svg>
            </span>
            <span>FTP</span>
          </button>
          <button class="nav-item" type="button" data-view="software">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 7h10"/><path d="M18 7h2"/><circle cx="16" cy="7" r="2"/><path d="M4 17h2"/><path d="M10 17h10"/><circle cx="8" cy="17" r="2"/><path d="M4 12h5"/><path d="M13 12h7"/><circle cx="11" cy="12" r="2"/></svg>
            </span>
            <span>软件管理</span>
          </button>
          <button class="nav-item" type="button" data-view="settings">
            <span class="nav-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/><path d="M4.9 10.3 3.4 8.9 6 4.4l2 .7a7.3 7.3 0 0 1 2.2-1.2L10.6 2h5l.4 1.9c.8.3 1.5.7 2.2 1.2l2-.7 2.5 4.5-1.5 1.4a8.3 8.3 0 0 1 0 3.4l1.5 1.4-2.5 4.5-2-.7a7.3 7.3 0 0 1-2.2 1.2l-.4 1.9h-5l-.4-1.9A7.3 7.3 0 0 1 8 18.9l-2 .7-2.6-4.5 1.5-1.4a8.3 8.3 0 0 1 0-3.4Z"/></svg>
            </span>
            <span>设置</span>
          </button>
        </nav>
      </aside>

      <main class="main">
        <header class="topbar">
          <div class="notice">
            <span class="speaker" aria-hidden="true"></span>
            <span>高性能云服务器最低15元/月&nbsp;&nbsp;QQ群：176643616</span>
          </div>
          <div class="window-tools" aria-hidden="true">
            <button type="button">☰</button>
            <button type="button">−</button>
            <button type="button">×</button>
          </div>
        </header>

        <section class="content">
          <div class="view is-visible" id="view-home">
            <section class="panel quick-panel">
              <h2 class="section-title">一键启动</h2>
              <div class="quick-actions">
                <div class="combo-card">
                  <span>WNMP</span>
                  <i class="status-dot running"></i>
                  <button class="primary compact" type="button" data-action="suite-toggle">停止</button>
                </div>
                <div class="combo-card">
                  <span>开机自启</span>
                  <i class="status-dot stopped"></i>
                  <button class="primary compact" type="button" data-action="autostart-toggle">启用</button>
                </div>
                <div class="combo-card">
                  <span>数据库工具</span>
                  <button class="primary compact" type="button" data-action="open-db-tool">打开</button>
                </div>
              </div>
            </section>

            <section class="panel service-panel">
              <h2 class="section-title">套件</h2>
              <div class="service-list" id="serviceList"></div>
            </section>

            <section class="panel log-panel">
              <div class="log-tabs">
                <button class="log-tab is-active" type="button" data-log-tab="运行状态">运行状态</button>
                <button class="log-tab" type="button" data-log-tab="资源信息">资源信息</button>
                <button class="log-tab" type="button" data-log-tab="日志文件">日志文件</button>
              </div>
              <div class="log-body">
                <div class="log-head">
                  <strong id="logTitle">运行状态</strong>
                  <button class="link-button" type="button" data-action="clear-log">清空</button>
                </div>
                <div class="log-lines" id="logLines"></div>
              </div>
            </section>
          </div>

          <div class="view" id="view-website">
            <div class="toolbar">
              <button class="primary" type="button" data-open-modal="site">+ 创建网站</button>
              <label class="search-box">
                <span aria-hidden="true">⌕</span>
                <input type="search" data-search="website" placeholder="查找" />
              </label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>序号</th>
                    <th>网站域名</th>
                    <th>端口</th>
                    <th>物理路径</th>
                    <th>状态</th>
                    <th>到期</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="websiteRows"></tbody>
              </table>
            </div>
          </div>

          <div class="view" id="view-database">
            <div class="toolbar">
              <button class="primary" type="button" data-open-modal="database">+ 创建数据库</button>
              <button class="primary soft" type="button" data-open-modal="root">✎ 修改root密码</button>
              <label class="search-box">
                <span aria-hidden="true">⌕</span>
                <input type="search" data-search="database" placeholder="查找" />
              </label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>序号</th>
                    <th>数据库</th>
                    <th>用户</th>
                    <th>密码</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="databaseRows"></tbody>
              </table>
            </div>
            <section class="backup-panel">
              <div class="backup-head">
                <h3>最近备份</h3>
                <button class="link-button" type="button" data-action="refresh-backups">刷新</button>
              </div>
              <div class="backup-list" id="backupList"></div>
            </section>
          </div>

          <div class="view" id="view-ftp">
            <div class="toolbar">
              <button class="primary" type="button" data-open-modal="ftp">+ 创建FTP</button>
              <label class="search-box">
                <span aria-hidden="true">⌕</span>
                <input type="search" data-search="ftp" placeholder="查找" />
              </label>
            </div>
            <div class="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>序号</th>
                    <th>用户名</th>
                    <th>根目录</th>
                    <th>权限</th>
                    <th>状态</th>
                    <th>操作</th>
                  </tr>
                </thead>
                <tbody id="ftpRows"></tbody>
              </table>
            </div>
          </div>

          <div class="view" id="view-software">
            <div class="software-head">
              <div class="tabs" id="softwareTabs"></div>
              <button class="link-button show-all" type="button" data-action="show-all">显示全部 ▼</button>
            </div>
            <div class="category-tabs" id="categoryTabs"></div>
            <div class="software-list" id="softwareList"></div>
          </div>

          <div class="view" id="view-settings">
            <div class="settings-card">
              <div class="settings-tabs">
                <button class="settings-tab" type="button" data-settings="system">系统设置</button>
                <button class="settings-tab is-active" type="button" data-settings="config">配置文件</button>
                <button class="settings-tab" type="button" data-settings="files">文件位置</button>
              </div>
              <div class="config-tabs" id="configTabs"></div>
              <div class="settings-content" id="settingsContent"></div>
            </div>
          </div>
        </section>

        <footer class="statusbar">
          <div class="status-left" id="statusLegend"></div>
          <div class="version"><span>ⓘ</span> 版本：8.1.1.3</div>
        </footer>
      </main>
    </div>

    <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
      <form class="modal" id="modalForm">
        <div class="modal-title">
          <h3 id="modalTitle">创建</h3>
          <button type="button" class="modal-close" data-action="close-modal">×</button>
        </div>
        <div class="modal-fields" id="modalFields"></div>
        <div class="modal-actions">
          <button class="ghost" type="button" data-action="close-modal">取消</button>
          <button class="primary" type="submit">确定</button>
        </div>
      </form>
    </div>

    <script src="app.js"></script>
  </body>
</html>
