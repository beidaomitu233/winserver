[package]
name = "winserver-desktop"
version = "1.0.0"
description = "WinServer Cloud Stack Desktop"
authors = ["WinServer"]
license = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
shared = { package = "winserver-shared", path = "../../shared" }
uuid = { version = "1", features = ["v4"] }
winserver-agent = { path = "../../agent" }
rusqlite = { version = "0.32", features = ["bundled"] }
sysinfo = "0.33"
handlebars = "6"
chrono = { version = "0.4", features = ["serde"] }
